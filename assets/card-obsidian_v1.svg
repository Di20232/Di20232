<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 190" width="430" height="190" role="img" aria-label="Cofre Obsidian">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1d1233"/></linearGradient>
    <linearGradient id="bd" x1="0" x2="1"><stop offset="0" stop-color="#e86a92"/><stop offset="1" stop-color="#9b6bd6"/></linearGradient>
    
    <path id="petal" d="M0 10 C-7 4 -8 -4 -3 -9 L0 -6 L3 -9 C8 -4 7 4 0 10Z"/>
    <g id="flower">
      <use href="#petal" transform="rotate(0) translate(0 -9)"/><use href="#petal" transform="rotate(72) translate(0 -9)"/><use href="#petal" transform="rotate(144) translate(0 -9)"/><use href="#petal" transform="rotate(216) translate(0 -9)"/><use href="#petal" transform="rotate(288) translate(0 -9)"/>
      <circle r="3.2" fill="#fff3f7"/>
      <circle r="1.6" fill="#e86a92"/>
    </g>
  </defs>
  <rect x="1" y="1" width="428" height="188" rx="14" fill="url(#bg)" stroke="url(#bd)" stroke-opacity=".75"/>
  <text x="410" y="168" text-anchor="end" font-family="'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', 'IPAMincho', 'Noto Sans JP', 'IPAGothic', serif" font-size="64" fill="#e86a92" opacity=".08">脳</text>
  <use href="#flower" fill="#f19bb6" opacity=".9" transform="translate(400 30) scale(.75)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" additive="sum"/>
  </use>
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
