    <text x="56" y="44" font-size="20" font-weight="700" fill="#ffd6e4">Cofre Obsidian</text>
    <text x="57" y="61" font-size="11.5" letter-spacing="1.5" fill="#8b949e">github.com/Di20232/obsidian_v1</text>
    <text x="24" y="86" font-size="14" fill="#c9d1d9">Meu segundo cérebro: notas de Python, IA,</text><text x="24" y="107" font-size="14" fill="#c9d1d9">GANs, segurança web e bancos de dados.</text>
    <rect x="24" y="138" width="79" height="24" rx="12" fill="#e86a92" fill-opacity=".13" stroke="#e86a92" stroke-opacity=".45"/><text x="64" y="154.5" text-anchor="middle" font-size="12" fill="#ffc2d6">Obsidian</text><rect x="111" y="138" width="79" height="24" rx="12" fill="#e86a92" fill-opacity=".13" stroke="#e86a92" stroke-opacity=".45"/><text x="151" y="154.5" text-anchor="middle" font-size="12" fill="#ffc2d6">Markdown</text><rect x="198" y="138" width="124" height="24" rx="12" fill="#e86a92" fill-opacity=".13" stroke="#e86a92" stroke-opacity=".45"/><text x="260" y="154.5" text-anchor="middle" font-size="12" fill="#ffc2d6">Knowledge Base</text>
    <circle cx="332" cy="174" r="5" fill="#ffffff"/>
    <text x="342" y="178" font-size="12" fill="#8b949e">Markdown</text>
  </g>
