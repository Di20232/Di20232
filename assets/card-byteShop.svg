<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 190" width="430" height="190" role="img" aria-label="ByteShop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#122233"/></linearGradient>
    <linearGradient id="bd" x1="0" x2="1"><stop offset="0" stop-color="#22c8f5"/><stop offset=".5" stop-color="#4d8dff"/><stop offset="1" stop-color="#7a6bff"/></linearGradient>
    
    <path id="petal" d="M0 10 C-7 4 -8 -4 -3 -9 L0 -6 L3 -9 C8 -4 7 4 0 10Z"/>
    <g id="flower">
      <use href="#petal" transform="rotate(0) translate(0 -9)"/><use href="#petal" transform="rotate(72) translate(0 -9)"/><use href="#petal" transform="rotate(144) translate(0 -9)"/><use href="#petal" transform="rotate(216) translate(0 -9)"/><use href="#petal" transform="rotate(288) translate(0 -9)"/>
      <circle r="3.2" fill="#f3f6ff"/>
      <circle r="1.6" fill="#4d8dff"/>
    </g>
  </defs>
  <rect x="1" y="1" width="428" height="188" rx="14" fill="url(#bg)" stroke="url(#bd)" stroke-opacity=".75"/>
  <text x="410" y="168" text-anchor="end" font-family="'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', 'IPAMincho', 'Noto Sans JP', 'IPAGothic', serif" font-size="64" fill="#4d8dff" opacity=".08">店</text>
  <use href="#flower" fill="#9baef1" opacity=".9" transform="translate(400 30) scale(.75)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" additive="sum"/>
  </use>
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <text x="24" y="44" font-size="22">🛒</text>
    <text x="56" y="44" font-size="20" font-weight="700" fill="#d6dfff">ByteShop</text>
    <text x="57" y="61" font-size="11.5" letter-spacing="1.5" fill="#8b949e">github.com/Di20232/byteShop</text>
    <text x="24" y="86" font-size="14" fill="#c9d1d9">E-commerce de peças de PC e periféricos:</text><text x="24" y="107" font-size="14" fill="#c9d1d9">catálogo, carrinho, checkout, login com JWT.</text>
    <rect x="24" y="138" width="72" height="24" rx="12" fill="#4d8dff" fill-opacity=".13" stroke="#4d8dff" stroke-opacity=".45"/><text x="60" y="154.5" text-anchor="middle" font-size="12" fill="#c2d0ff">FastAPI</text><rect x="104" y="138" width="57" height="24" rx="12" fill="#4d8dff" fill-opacity=".13" stroke="#4d8dff" stroke-opacity=".45"/><text x="132" y="154.5" text-anchor="middle" font-size="12" fill="#c2d0ff">React</text><rect x="169" y="138" width="94" height="24" rx="12" fill="#4d8dff" fill-opacity=".13" stroke="#4d8dff" stroke-opacity=".45"/><text x="216" y="154.5" text-anchor="middle" font-size="12" fill="#c2d0ff">TypeScript</text><rect x="271" y="138" width="64" height="24" rx="12" fill="#4d8dff" fill-opacity=".13" stroke="#4d8dff" stroke-opacity=".45"/><text x="303" y="154.5" text-anchor="middle" font-size="12" fill="#c2d0ff">SQLite</text><rect x="343" y="138" width="79" height="24" rx="12" fill="#4d8dff" fill-opacity=".13" stroke="#4d8dff" stroke-opacity=".45"/><text x="383" y="154.5" text-anchor="middle" font-size="12" fill="#c2d0ff">Tailwind</text>
    <circle cx="332" cy="174" r="5" fill="#3572A5"/>
    <text x="342" y="178" font-size="12" fill="#8b949e">Python</text>
  </g>
</svg>
